name: 'Upload S3'
description: 'Upload to S3 bucket'
inputs:
  game_id:
    description: 'Game ID'
    required: true
  s3_url:
    description: 'S3 URL'
    required: true
  manifest_path:
    description: '可快取檔案清單輸出路徑 (給 CDN purge 步驟讀)；留空則不產生'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Upload to S3
      shell: cmd
      # 直接上傳 build 產物，S3 前綴由 --dest 指定（來源資料夾名是 web-mobile，不能沿用 basename 規則）
      run: |
        upload_project_to_s3_v2.exe %INPUT_S3_URL% game\%INPUT_GAME_ID%\build\web-mobile AWS_ENV ap-southeast-1 %INPUT_MANIFEST_PATH% --dest %INPUT_GAME_ID%
      env:
        INPUT_GAME_ID: ${{ inputs.game_id }}
        INPUT_S3_URL: ${{ inputs.s3_url }}
        INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}

