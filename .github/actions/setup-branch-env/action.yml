name: 'Setup Branch Environment'
description: 'Setup branch environment variables based on branch name or environment input'
inputs:
  github_ref_name:
    description: 'GitHub ref name'
    required: true
  environment:
    description: 'Deploy environment (demo/stage/prod). If provided, overrides branch-based detection.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Setup branch env
      shell: cmd
      run: |
        REM If environment input is provided, use it; otherwise use github_ref_name
        IF NOT "%INPUT_ENVIRONMENT%"=="" (
            SET "REF_NAME=%INPUT_ENVIRONMENT%"
            ECHO CLONE_BRANCH=release>> %GITHUB_ENV%
        ) ELSE (
            SET "REF_NAME=%INPUT_GITHUB_REF_NAME%"
            ECHO CLONE_BRANCH=%INPUT_GITHUB_REF_NAME%>> %GITHUB_ENV%
        )

        IF /I "%REF_NAME%" == "dev" (
            ECHO BRANCH=dev>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5gdev>> %GITHUB_ENV%
        ) ELSE IF /I "%REF_NAME%" == "main" (
            ECHO BRANCH=main>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5gdev>> %GITHUB_ENV%
        ) ELSE IF /I "%REF_NAME%" == "demo" (
            ECHO BRANCH=demo>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5gdemo>> %GITHUB_ENV%
        ) ELSE IF /I "%REF_NAME%" == "uat" (
            ECHO BRANCH=uat>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5guat>> %GITHUB_ENV%
        ) ELSE IF /I "%REF_NAME%" == "stage" (
            ECHO BRANCH=stage>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5gstage>> %GITHUB_ENV%
        ) ELSE IF /I "%REF_NAME%" == "prod" (
            ECHO BRANCH=prod>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5g>> %GITHUB_ENV%
            ECHO CDN_BYTEPLUS_URLS=https://download.figoldgod.vip,https://download.figungun.win,https://download.yapyifkt.vip,https://download.xmlkdzbz.vip,https://download.figoogoo.com>> %GITHUB_ENV%
        ) ELSE (
            ECHO BRANCH=%REF_NAME%>> %GITHUB_ENV%
            ECHO S3_URL=s3://download-5gdev>> %GITHUB_ENV%
        )
      env:
        INPUT_GITHUB_REF_NAME: ${{ inputs.github_ref_name }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
