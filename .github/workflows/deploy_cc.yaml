name: Windows Self-Hosted Runner

on:
  workflow_call:
    inputs:
      GAME_ID:
        required: true
        type: string
      COCOS_CREATOR_VERSION:
        required: false
        type: string
      ENVIRONMENT:
        required: false
        type: string
        default: ''
      TAG:
        required: false
        type: string
        default: ''
      ENABLE_ZIP_BUNDLE:
        required: false
        type: string
        default: 'false'
      ENABLE_LOW_RES:
        required: false
        type: string
        default: 'false'
    secrets:
      TOKEN:
        required: true
      AWS_ENV:
        required: true
      CLOUD_FLARE:
        required: true
      SADP_AWSCLI_CLOUDFRONT:
        required: true
      BYTEPLUS_CDN_API_CREDENTIALS:
        required: false
      WEBHOOK_URL:
        required: true
env:
  # Cocos Creator Version
  COCOS_VERSION: ${{ format('C:\ProgramData\cocos\editors\Creator\{0}\CocosCreator.exe', inputs.COCOS_CREATOR_VERSION || '3.7.2') }}
  SLACK: true
  # 上傳與 CDN 探測的 exe 在執行期讀名為 AWS_ENV 的環境變數（composite step 繼承 workflow env）
  AWS_ENV: ${{ secrets.AWS_ENV }}

jobs:
  creator:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Clean Cocos Creator caches
        run: |
          $paths = @(
            "$env:USERPROFILE\.CocosCreator",
            "$env:USERPROFILE\AppData\Local\Temp\CocosCreator\${{ inputs.COCOS_CREATOR_VERSION || '3.7.2' }}\builder\engine"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item -Recurse -Force $path
              Write-Host "Successfully deleted: $path"
            } else {
              Write-Host "Directory does not exist: $path"
            }
          }

      - name: Setup branch env
        uses: 5G-Games/Games-Common-CI/.github/actions/setup-branch-env@test_slim_pipeline
        with:
          github_ref_name: ${{ github.ref_name }}
          environment: ${{ inputs.ENVIRONMENT }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Cleanup workspace before build
        uses: 5G-Games/Games-Common-CI/.github/actions/cleanup-workspace@new_deploy

      - name: Configure Git
        uses: 5G-Games/Games-Common-CI/.github/actions/configure-git@new_deploy
        with:
          github_deploy: ${{ secrets.TOKEN }}

      - name: Clone deploy script
        uses: 5G-Games/Games-Common-CI/.github/actions/clone-deploy-script@new_deploy
        with:
          github_deploy: ${{ secrets.TOKEN }}

      - name: Clone game repositories
        uses: 5G-Games/Games-Common-CI/.github/actions/clone-game-repositories@new_deploy
        with:
          github_deploy: ${{ secrets.TOKEN }}
          game_id: ${{ inputs.GAME_ID }}
          branch: ${{ env.CLONE_BRANCH }}
          tag: ${{ inputs.TAG }}

      - name: Slack Notification - Start
        if: ${{ env.SLACK == 'true' }}
        continue-on-error: true   # 通知失敗不可中斷部署
        uses: 5G-Games/Games-Common-CI/.github/actions/slack-notification@new_deploy
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          job_status: success
          repository: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref }}
          actor: ${{ github.actor }}
          triggering_actor: ${{ github.triggering_actor || 'N/A' }}
          commit_message: ${{ github.event.head_commit.message || 'N/A' }}
          version_hash: ${{ env.VERSION_HASH || 'N/A' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          compare_url: ${{ github.event.compare || 'N/A' }}
          status_text: 'Start'
          tag: ${{ inputs.TAG }}
          runner_name: ${{ runner.name }}
          deploy_env: ${{ env.BRANCH }}

      - name: npm install
        uses: 5G-Games/Games-Common-CI/.github/actions/npm-install@test_slim_pipeline
        with:
          game_id: ${{ inputs.GAME_ID }}

      - name: Clone submodules
        uses: 5G-Games/Games-Common-CI/.github/actions/clone-submodules@new_deploy
        with:
          game_id: ${{ inputs.GAME_ID }}

      - name: Update CHEAT config
        if: ${{ env.BRANCH == 'stage' || env.BRANCH == 'prod' || env.BRANCH == 'demo' }}
        uses: 5G-Games/Games-Common-CI/.github/actions/update-cheat-config@new_deploy
        with:
          game_id: ${{ inputs.GAME_ID }}
          branch: ${{ env.BRANCH }}

      - name: Replace Build Config
        uses: 5G-Games/Games-Common-CI/.github/actions/replace-build-config@new_deploy
        with:
          game_id: ${{ inputs.GAME_ID }}
          branch: ${{ env.BRANCH }}

      - name: Build Cocos Mobile
        uses: 5G-Games/Games-Common-CI/.github/actions/build-cocos-mobile@new_deploy
        with:
          game_id: ${{ inputs.GAME_ID }}
          cocos_version: ${{ env.COCOS_VERSION }}
          enable_low_res: ${{ inputs.ENABLE_LOW_RES }}

      - name: build ZIP
        if: ${{ inputs.ENABLE_ZIP_BUNDLE == 'true' }}
        run: |
          $script = "game\${{ inputs.GAME_ID }}\build-templates\scripts\build-zip.js"
          if (Test-Path $script) {
            node $script
          }

      - name: Post-build processing
        run: |
          $script = "game\${{ inputs.GAME_ID }}\build-templates\scripts\post-build.js"
          if (Test-Path $script) {
            $env:ENABLE_ZIP_BUNDLE = "${{ inputs.ENABLE_ZIP_BUNDLE }}"
            $env:ENABLE_LOW_RES = "${{ inputs.ENABLE_LOW_RES }}"
            node $script
          }

      - name: Upload S3
        uses: 5G-Games/Games-Common-CI/.github/actions/upload-s3@test_slim_pipeline
        with:
          game_id: ${{ inputs.GAME_ID }}
          s3_url: ${{ env.S3_URL }}
          manifest_path: ${{ github.workspace }}\purge_manifest.txt

      # .pack 是 build 期預壓的 brotli（見 build-templates/scripts/build-zip.js），
      # 必須帶 Content-Encoding: br 瀏覽器才會原生解壓；upload exe 不支援自訂
      # metadata（.pack 會拿到 no-cache 且無 encoding），故上傳後補一發 self-copy。
      # 只在 build 產出 .pack 時觸發；aws cli 未安裝只警告不擋 build（前端會走
      # 逐檔 fallback，不會壞、只是拿不到 pack 收益）。後續 CDN cache prune 讓新 metadata 生效。
      - name: Fix pack metadata (Content-Encoding br)
        shell: powershell
        run: |
          $pack = Get-ChildItem "game\$env:INPUT_GAME_ID\build\web-mobile\assets\bundles.*.pack" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pack) { Write-Host "No .pack in build output, skipping"; exit 0 }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Warning ".pack found but aws cli is not installed on this runner; pack will be served WITHOUT Content-Encoding: br and players fall back to per-file HTTP. Install AWS CLI v2 (msi) to enable."
            exit 0
          }
          $rawEnv = $env:AWS_ENV -replace '\\n', "`n"
          foreach ($line in $rawEnv -split "`r?`n") {
            if ($line -match '^\s*([A-Z_]+)=(.*)$') {
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2].Trim()
            }
          }
          $env:AWS_DEFAULT_REGION = 'ap-southeast-1'
          $bucket = $env:INPUT_S3_URL -replace '^s3://', ''
          $dest = "s3://$bucket/$env:INPUT_GAME_ID/assets/$($pack.Name)"
          aws s3 cp $dest $dest `
            --content-encoding br --content-type application/octet-stream `
            --cache-control "public, max-age=31536000" --metadata-directive REPLACE
          if ($LASTEXITCODE -ne 0) { Write-Warning "pack metadata fix failed (exit $LASTEXITCODE); pack falls back per-file"; exit 0 }
          Write-Host "OK: $dest now served with Content-Encoding: br"
        env:
          INPUT_GAME_ID: ${{ inputs.GAME_ID }}
          INPUT_S3_URL: ${{ env.S3_URL }}

      - name: Upload Remote Bundle (Templete only)
        if: ${{ inputs.GAME_ID == 'Templete' }}
        uses: 5G-Games/Games-Common-CI/.github/actions/upload-remote-bundle@new_deploy
        with:
          game_id: ${{ inputs.GAME_ID }}
          s3_url: ${{ env.S3_URL }}

      - name: CDN cache prune
        uses: 5G-Games/Games-Common-CI/.github/actions/cdn-cache-prune@test_slim_pipeline
        with:
          game_id: ${{ inputs.GAME_ID }}
          manifest_path: ${{ github.workspace }}\purge_manifest.txt
          s3_url: ${{ env.S3_URL }}
          cloud_flare_api: ${{ secrets.CLOUD_FLARE }}
          cloud_front_cn_api: ${{ secrets.SADP_AWSCLI_CLOUDFRONT }}
          cdn_byteplus_urls: ${{ env.CDN_BYTEPLUS_URLS }}
          byteplus_cdn_api: ${{ secrets.BYTEPLUS_CDN_API_CREDENTIALS }}

      - name: Cleanup workspace after build
        uses: 5G-Games/Games-Common-CI/.github/actions/cleanup-workspace@new_deploy
        with:
          best_effort: 'true'

      - name: Slack Notification - Complete
        if: ${{ env.SLACK == 'true' }}
        continue-on-error: true   # 通知失敗不可中斷部署
        uses: 5G-Games/Games-Common-CI/.github/actions/slack-notification@new_deploy
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          job_status: ${{ job.status }}
          repository: ${{ github.repository }}
          branch: ${{ github.head_ref || github.ref }}
          actor: ${{ github.actor }}
          triggering_actor: ${{ github.triggering_actor || 'N/A' }}
          commit_message: ${{ github.event.head_commit.message || 'N/A' }}
          version_hash: ${{ env.VERSION_HASH || 'N/A' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          compare_url: ${{ github.event.compare || 'N/A' }}
          tag: ${{ inputs.TAG }}
          runner_name: ${{ runner.name }}
          deploy_env: ${{ env.BRANCH }}
